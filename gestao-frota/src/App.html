<script>
/* =====================================================================
 * App.html — lógica da tela (roda no navegador).
 * Conversa com o servidor por uma única função: api(token, acao, payload).
 * ===================================================================== */

var estado = { token: null, usuario: null, listas: {}, fotos: {} };

// ---------- Utilidades ----------
function $(sel, raiz) { return (raiz || document).querySelector(sel); }
function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }
function esc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function armazenar(chave, valor) {
  try { if (valor === null) localStorage.removeItem(chave); else localStorage.setItem(chave, valor); } catch (e) {}
}
function lerArmazenado(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }

function hojeISO() {
  var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function diasAte(iso) {
  if (!iso) return null;
  var alvo = new Date(iso + 'T00:00:00'), hoje = new Date(hojeISO() + 'T00:00:00');
  return Math.round((alvo - hoje) / 86400000);
}
function fmtData(iso) { return iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : (iso || ''); }
function fmtKm(v) { return v ? Number(v).toLocaleString('pt-BR') + ' km' : '—'; }
function fmtMoeda(v) { return v ? Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '—'; }
function fmtCpf(v) { v = String(v || ''); return v.length === 11 ? v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : v; }
function fmtTel(v) { v = String(v || ''); return v.length === 11 ? v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : v.length === 10 ? v.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3') : v; }

var ROTULOS = {
  disponivel: 'Disponível', locado: 'Locado', manutencao: 'Manutenção', inativo: 'Inativo',
  ativo: 'Ativo', bloqueado: 'Bloqueado', administrador: 'Administrador', operador: 'Operador',
  flex: 'Flex', gasolina: 'Gasolina', etanol: 'Etanol', diesel: 'Diesel', gnv: 'GNV', eletrico: 'Elétrico', hibrido: 'Híbrido',
  cadastro: 'Cadastro', entrega: 'Entrega', devolucao: 'Devolução', motorista: 'Motorista', ajuste: 'Ajuste',
  uber: 'Uber', '99': '99', indrive: 'inDrive', outra: 'Outra', nenhuma: 'Nenhuma',
  foto_veiculo: 'Foto do veículo', foto_motorista: 'Foto do motorista', cnh: 'CNH',
  comprovante_residencia: 'Comprovante de residência', documento_veiculo: 'Documento (CRLV)', outro: 'Outro'
};
function rotulo(v) { return ROTULOS[v] || v || ''; }
var COR_STATUS = { disponivel: 'ok', locado: 'neutro', manutencao: 'alerta', inativo: 'perigo', ativo: 'ok', bloqueado: 'perigo' };
function selo(v, cor) { return '<span class="selo ' + (cor || COR_STATUS[v] || 'neutro') + '">' + esc(rotulo(v)) + '</span>'; }

function pode(tabela, acao) {
  var p = (estado.usuario && estado.usuario.permissoes) || {};
  return (p[tabela] || []).indexOf(acao) >= 0;
}

// ---------- Comunicação com o servidor ----------
var pendentes = 0;
function carregando(on) {
  pendentes += on ? 1 : -1;
  $('#carregando').classList.toggle('oculto', pendentes <= 0);
}
function chamar(acao, payload, silencioso) {
  return new Promise(function (resolve, reject) {
    if (!silencioso) carregando(true);
    google.script.run
      .withSuccessHandler(function (r) {
        if (!silencioso) carregando(false);
        if (r && r.ok) return resolve(r.dados);
        var erro = (r && r.erro) || 'Erro desconhecido';
        if (erro === 'SESSAO_EXPIRADA') { sairLocal(); erro = 'Sua sessão expirou. Entre novamente.'; }
        reject(new Error(erro));
      })
      .withFailureHandler(function (e) {
        if (!silencioso) carregando(false);
        reject(new Error('Falha de comunicação: ' + (e && e.message ? e.message : e)));
      })
      .api(estado.token, acao, payload || {});
  });
}

var timerAviso;
function aviso(msg, ehErro) {
  var el = $('#aviso');
  el.textContent = msg;
  el.classList.toggle('erro-aviso', !!ehErro);
  el.classList.remove('oculto');
  clearTimeout(timerAviso);
  timerAviso = setTimeout(function () { el.classList.add('oculto'); }, ehErro ? 6000 : 3000);
}
function falhou(e) { aviso(e.message || String(e), true); }

// ---------- Modal ----------
function abrirModal(html) {
  // troca o elemento para descartar os "ouvintes" de cliques do modal anterior
  var velho = $('#modal-corpo'), novo = velho.cloneNode(false);
  novo.innerHTML = html;
  velho.parentNode.replaceChild(novo, velho);
  if (!$('#modal').open) $('#modal').showModal();
}
function fecharModal() { $('#modal').close(); $('#modal-corpo').innerHTML = ''; }
$('#modal').addEventListener('click', function (ev) { if (ev.target === this) fecharModal(); });

// ---------- Tema ----------
function aplicarTema(t) {
  if (['claro', 'escuro', 'frota'].indexOf(t) < 0) t = 'claro';
  document.body.setAttribute('data-tema', t);
  armazenar('tema', t);
}

// ---------- Login / sessão ----------
function mostrarLogin() {
  $('#app').classList.add('oculto');
  $('#tela-login').classList.remove('oculto');
}
function sairLocal() {
  estado.token = null; estado.usuario = null; estado.fotos = {};
  armazenar('token', null);
  mostrarLogin();
}
$('#form-login').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var f = ev.target;
  $('#login-erro').textContent = '';
  chamar('login', { email: f.email.value, senha: f.senha.value })
    .then(function (r) {
      estado.token = r.token;
      armazenar('token', r.token);
      f.senha.value = '';
      return iniciarSessao();
    })
    .catch(function (e) { $('#login-erro').textContent = e.message; });
});
$('#btn-sair').addEventListener('click', function () {
  chamar('logout', {}, true).catch(function () {});
  sairLocal();
});

function iniciarSessao() {
  return chamar('sessao').then(function (r) {
    estado.usuario = r.usuario;
    estado.listas = r.listas;
    aplicarTema(r.usuario.tema);
    $('#usuario-nome').textContent = r.usuario.nome;
    $$('#menu [data-perm]').forEach(function (a) {
      a.classList.toggle('oculto', !pode(a.getAttribute('data-perm'), 'ler'));
    });
    $('#tela-login').classList.add('oculto');
    $('#app').classList.remove('oculto');
    rotear();
  });
}

// ---------- Rotas ----------
window.addEventListener('hashchange', rotear);
function ir(hash) { if (location.hash === hash) rotear(); else location.hash = hash; }

function rotear() {
  if (!estado.usuario) return;
  var partes = (location.hash || '#inicio').slice(1).split('/');
  var rota = partes[0] || 'inicio';
  $$('#menu a').forEach(function (a) { a.classList.toggle('ativo', a.getAttribute('data-rota') === rota); });
  window.scrollTo(0, 0);
  var tela = TELAS[rota] || TELAS.inicio;
  try { tela(partes[1], partes[2]); } catch (e) { falhou(e); }
}

function render(html) { $('#conteudo').innerHTML = html; }

// ---------- Definição dos campos dos formulários ----------
var CAMPOS = {
  veiculos: [
    { n: 'placa', r: 'Placa', obr: true, ph: 'ABC1D23' },
    { n: 'marca', r: 'Marca', obr: true },
    { n: 'modelo', r: 'Modelo', obr: true },
    { n: 'versao', r: 'Versão' },
    { n: 'ano_fabricacao', r: 'Ano fabricação', tipo: 'number' },
    { n: 'ano_modelo', r: 'Ano modelo', tipo: 'number' },
    { n: 'cor', r: 'Cor' },
    { n: 'combustivel', r: 'Combustível', lista: 'combustivel' },
    { n: 'renavam', r: 'RENAVAM', modo: 'numeric' },
    { n: 'chassi', r: 'Chassi' },
    { n: 'codigo_fipe', r: 'Código FIPE', ph: '000000-0' },
    { n: 'km_atual', r: 'Km atual', modo: 'numeric', soNovo: true },
    { n: 'data_aquisicao', r: 'Data de aquisição', tipo: 'date' },
    { n: 'valor_aquisicao', r: 'Valor de aquisição (R$)', modo: 'decimal' },
    { n: 'status', r: 'Status', lista: 'status_veiculo', obr: true, padrao: 'disponivel' },
    { n: 'observacoes', r: 'Observações', tipo: 'textarea' }
  ],
  motoristas: [
    { n: 'nome', r: 'Nome completo', obr: true, largo: true },
    { n: 'cpf', r: 'CPF', obr: true, modo: 'numeric' },
    { n: 'rg', r: 'RG' },
    { n: 'data_nascimento', r: 'Data de nascimento', tipo: 'date' },
    { n: 'telefone', r: 'Telefone / WhatsApp', obr: true, modo: 'tel' },
    { n: 'email', r: 'E-mail', tipo: 'email' },
    { n: 'cep', r: 'CEP', modo: 'numeric' },
    { n: 'endereco', r: 'Endereço', largo: true },
    { n: 'cidade', r: 'Cidade' },
    { n: 'uf', r: 'UF', max: 2 },
    { n: 'cnh_numero', r: 'Nº da CNH', obr: true, modo: 'numeric' },
    { n: 'cnh_categoria', r: 'Categoria CNH', lista: 'cnh_categoria', padrao: 'B' },
    { n: 'cnh_validade', r: 'Validade da CNH', tipo: 'date', obr: true },
    { n: 'plataforma', r: 'Plataforma de app', lista: 'plataforma', padrao: 'uber' },
    { n: 'status', r: 'Status', lista: 'status_motorista', obr: true, padrao: 'ativo' },
    { n: 'observacoes', r: 'Observações', tipo: 'textarea' }
  ]
};

function campoHtml(c, valor, ehNovo) {
  if (c.soNovo && !ehNovo) return '';
  var v = valor !== undefined && valor !== '' ? valor : (ehNovo && c.padrao) || '';
  var classe = c.largo || c.tipo === 'textarea' ? ' class="largo"' : '';
  var req = c.obr ? ' required' : '';
  var inner;
  if (c.lista) {
    inner = '<select name="' + c.n + '"' + req + '>' + (c.obr ? '' : '<option value=""></option>') +
      (estado.listas[c.lista] || []).map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(rotulo(o)) + '</option>';
      }).join('') + '</select>';
  } else if (c.tipo === 'textarea') {
    inner = '<textarea name="' + c.n + '" rows="3">' + esc(v) + '</textarea>';
  } else {
    inner = '<input name="' + c.n + '" type="' + (c.tipo || 'text') + '" value="' + esc(v) + '"' + req +
      (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + (c.modo ? ' inputmode="' + c.modo + '"' : '') +
      (c.max ? ' maxlength="' + c.max + '"' : '') + '>';
  }
  return '<label' + classe + '>' + esc(c.r) + (c.obr ? ' *' : '') + inner + '</label>';
}

function lerForm(form) {
  var d = {};
  $$('input[name], select[name], textarea[name]', form).forEach(function (el) { d[el.name] = el.value; });
  return d;
}

// ---------- Fotos e arquivos ----------
function carregarFoto(arquivoId) {
  if (!arquivoId) return Promise.resolve(null);
  if (estado.fotos[arquivoId]) return Promise.resolve(estado.fotos[arquivoId]);
  return chamar('verArquivo', { id: arquivoId }, true).then(function (r) {
    estado.fotos[arquivoId] = r.dataUrl;
    return r.dataUrl;
  });
}
function preencherFotos(raiz) {
  $$('[data-foto]', raiz).forEach(function (el) {
    carregarFoto(el.getAttribute('data-foto')).then(function (url) {
      if (url) el.innerHTML = '<img alt="" src="' + url + '">';
    }).catch(function () {});
  });
}

/** Lê o arquivo escolhido. Fotos são reduzidas para no máximo 1600px (economiza espaço e tempo). */
function prepararArquivo(file) {
  return new Promise(function (resolve, reject) {
    if (file.type === 'application/pdf') {
      if (file.size > 5 * 1024 * 1024) return reject(new Error('PDF maior que 5 MB.'));
      var fr = new FileReader();
      fr.onload = function () { resolve({ nome: file.name, mime: file.type, base64: fr.result.split(',')[1] }); };
      fr.onerror = function () { reject(new Error('Não foi possível ler o arquivo.')); };
      return fr.readAsDataURL(file);
    }
    if (!/^image\//.test(file.type)) return reject(new Error('Envie uma imagem ou PDF.'));
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      var dataUrl = cv.toDataURL('image/jpeg', 0.82);
      resolve({ nome: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', base64: dataUrl.split(',')[1] });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Imagem inválida.')); };
    img.src = url;
  });
}

function galeriaHtml(entidade, id) {
  return '<div class="secao cartao"><div class="barra"><h3>Fotos e documentos</h3>' +
    (pode('arquivos', 'criar') ? '<button class="btn pequeno" type="button" data-acao="enviar-arquivo">+ Adicionar</button>' : '') +
    '</div><div class="galeria" id="galeria"><p class="vazio">Carregando…</p></div></div>';
}

function carregarGaleria(entidade, registro, aoAtualizar) {
  chamar('listarArquivos', { entidade: entidade, entidade_id: registro.id }, true).then(function (lista) {
    var g = $('#galeria');
    if (!g) return;
    if (!lista.length) { g.innerHTML = '<p class="vazio">Nenhum arquivo.</p>'; return; }
    g.innerHTML = lista.map(function (a) {
      var ehImg = /^image\//.test(a.mime);
      return '<figure><div class="thumb" data-arquivo="' + esc(a.id) + '" ' + (ehImg ? 'data-foto="' + esc(a.id) + '"' : '') + '>' +
        (ehImg ? '…' : '📄') + '</div><figcaption>' + esc(rotulo(a.tipo)) +
        (registro.foto_id === a.id ? ' ★' : '') + '</figcaption></figure>';
    }).join('');
    preencherFotos(g);
    $$('[data-arquivo]', g).forEach(function (el) {
      el.addEventListener('click', function () {
        var arq = lista.filter(function (x) { return x.id === el.getAttribute('data-arquivo'); })[0];
        verArquivoModal(entidade, registro, arq, aoAtualizar);
      });
    });
  }).catch(falhou);
}

function verArquivoModal(entidade, registro, arq, aoAtualizar) {
  chamar('verArquivo', { id: arq.id }).then(function (r) {
    var ehImg = /^image\//.test(r.mime);
    abrirModal('<h3>' + esc(rotulo(arq.tipo)) + '</h3>' +
      (ehImg ? '<img class="ampliada" alt="" src="' + r.dataUrl + '">'
        : '<p><a download="' + esc(r.nome) + '" href="' + r.dataUrl + '">Baixar ' + esc(r.nome) + '</a></p>') +
      '<div class="acoes">' +
      (ehImg && pode(entidade, 'editar') && registro.foto_id !== arq.id ? '<button class="btn" data-a="principal">Definir como foto principal</button>' : '') +
      (pode('arquivos', 'excluir') ? '<button class="btn perigo" data-a="excluir">Excluir</button>' : '') +
      '<button class="btn" data-a="fechar">Fechar</button></div>');
    $('#modal-corpo').addEventListener('click', function (ev) {
      var a = ev.target.getAttribute('data-a');
      if (a === 'fechar') fecharModal();
      if (a === 'principal') {
        chamar('salvar', { tabela: entidade, id: registro.id, dados: { foto_id: arq.id } })
          .then(function () { fecharModal(); aviso('Foto principal atualizada.'); aoAtualizar(); }).catch(falhou);
      }
      if (a === 'excluir' && confirm('Excluir este arquivo?')) {
        chamar('excluirArquivo', { id: arq.id }).then(function () { fecharModal(); aviso('Arquivo excluído.'); aoAtualizar(); }).catch(falhou);
      }
    });
  }).catch(falhou);
}

function enviarArquivoModal(entidade, registro, tiposPermitidos, aoAtualizar) {
  abrirModal('<h3>Adicionar foto ou documento</h3><form id="f-arq" class="form">' +
    '<label class="largo">Tipo<select name="tipo">' + tiposPermitidos.map(function (t) {
      return '<option value="' + t + '">' + esc(rotulo(t)) + '</option>'; }).join('') + '</select></label>' +
    '<label class="largo">Arquivo (foto ou PDF)<input type="file" name="arquivo" accept="image/*,application/pdf" required></label>' +
    '<label class="largo" style="flex-direction:row;align-items:center"><input type="checkbox" name="principal" style="width:auto"> Usar como foto principal</label>' +
    '</form><div class="acoes"><button class="btn" type="button" data-a="cancelar">Cancelar</button>' +
    '<button class="btn primario" type="button" data-a="enviar">Enviar</button></div>');
  var form = $('#f-arq');
  $('#modal-corpo').addEventListener('click', function (ev) {
    var a = ev.target.getAttribute('data-a');
    if (a === 'cancelar') fecharModal();
    if (a !== 'enviar') return;
    var file = form.arquivo.files[0];
    if (!file) return aviso('Escolha um arquivo.', true);
    ev.target.disabled = true;
    carregando(true);
    prepararArquivo(file).then(function (arq) {
      carregando(false);
      return chamar('enviarArquivo', {
        entidade: entidade, entidade_id: registro.id, tipo: form.tipo.value,
        nome: arq.nome, mime: arq.mime, base64: arq.base64,
        definirComoFoto: form.principal.checked && arq.mime !== 'application/pdf'
      });
    }).then(function () {
      fecharModal(); aviso('Arquivo enviado.'); aoAtualizar();
    }).catch(function (e) { ev.target.disabled = false; carregando(false); falhou(e); });
  });
}

// ---------- Telas ----------
var TELAS = {};

TELAS.inicio = function () {
  render('<h2>Início</h2><p class="vazio">Carregando…</p>');
  Promise.all([chamar('listar', { tabela: 'veiculos' }), chamar('listar', { tabela: 'motoristas' })])
    .then(function (r) {
      var veic = r[0], mot = r[1];
      var cont = function (s) { return veic.filter(function (v) { return v.status === s; }).length; };
      var cnh = mot.filter(function (m) { return m.status !== 'inativo'; })
        .map(function (m) { return { m: m, d: diasAte(m.cnh_validade) }; })
        .filter(function (x) { return x.d !== null && x.d <= 30; })
        .sort(function (a, b) { return a.d - b.d; });
      render('<h2>Olá, ' + esc(estado.usuario.nome.split(' ')[0]) + '</h2>' +
        '<div class="indicadores">' +
        ind(veic.length, 'Veículos') + ind(cont('disponivel'), 'Disponíveis') + ind(cont('locado'), 'Locados') +
        ind(cont('manutencao'), 'Em manutenção') + ind(mot.filter(function (m) { return m.status === 'ativo'; }).length, 'Motoristas ativos') +
        '</div>' +
        '<div class="cartao"><h3>CNH vencida ou vencendo em 30 dias</h3>' +
        (cnh.length ? '<div class="tabela-rolagem"><table><tr><th>Motorista</th><th>Validade</th><th>Situação</th></tr>' +
          cnh.map(function (x) {
            return '<tr><td><a href="#motoristas/' + esc(x.m.id) + '">' + esc(x.m.nome) + '</a></td><td>' + fmtData(x.m.cnh_validade) +
              '</td><td>' + situacaoCnh(x.m.cnh_validade) + '</td></tr>';
          }).join('') + '</table></div>' : '<p class="vazio">Nenhuma CNH vencendo.</p>') +
        '</div><p class="vazio">Manutenção, contratos e financeiro entram nas próximas etapas.</p>');
    }).catch(falhou);
  function ind(v, r) { return '<div class="cartao indicador"><div class="valor">' + v + '</div><div class="rotulo">' + r + '</div></div>'; }
};

function situacaoCnh(validade) {
  var d = diasAte(validade);
  if (d === null) return selo('Sem data', 'neutro');
  if (d < 0) return selo('Vencida há ' + (-d) + ' dia(s)', 'perigo');
  if (d <= 30) return selo('Vence em ' + d + ' dia(s)', 'alerta');
  return selo('Válida', 'ok');
}

// ----- Lista genérica (veículos e motoristas) -----
function telaLista(cfg) {
  render('<div class="barra"><h2>' + cfg.titulo + '</h2>' +
    '<input type="search" id="busca" placeholder="Buscar…" value="' + esc(lerArmazenado('busca_' + cfg.tabela) || '') + '">' +
    (pode(cfg.tabela, 'criar') ? '<a class="btn primario" href="#' + cfg.tabela + '/novo">+ Novo</a>' : '') +
    '</div><div id="lista" class="grade"><p class="vazio">Carregando…</p></div>');
  chamar('listar', { tabela: cfg.tabela }).then(function (itens) {
    itens.sort(cfg.ordenar);
    var desenhar = function () {
      var termo = $('#busca').value.trim().toLowerCase();
      armazenar('busca_' + cfg.tabela, termo);
      var filtrados = itens.filter(function (i) { return !termo || cfg.textoBusca(i).toLowerCase().indexOf(termo) >= 0; });
      $('#lista').innerHTML = filtrados.length ? filtrados.map(function (i) {
        return '<a class="cartao item" style="text-decoration:none;color:inherit" href="#' + cfg.tabela + '/' + esc(i.id) + '">' +
          '<div class="miniatura"' + (i.foto_id ? ' data-foto="' + esc(i.foto_id) + '"' : '') + '>' + cfg.icone + '</div>' +
          '<div class="info"><div class="titulo">' + cfg.titulo1(i) + '</div><div class="sub">' + cfg.sub(i) + '</div></div></a>';
      }).join('') : '<p class="vazio">' + (termo ? 'Nada encontrado.' : 'Nenhum cadastro ainda.') + '</p>';
      preencherFotos($('#lista'));
    };
    $('#busca').addEventListener('input', desenhar);
    desenhar();
  }).catch(falhou);
}

// ----- Formulário genérico -----
function telaForm(tabela, id, titulo) {
  var ehNovo = !id;
  var p = ehNovo ? Promise.resolve({}) : chamar('buscar', { tabela: tabela, id: id });
  p.then(function (reg) {
    render('<h2>' + (ehNovo ? 'Novo ' : 'Editar ') + titulo + '</h2><form id="f" class="cartao"><div class="form">' +
      CAMPOS[tabela].map(function (c) { return campoHtml(c, reg[c.n], ehNovo); }).join('') +
      '</div><div class="acoes"><a class="btn" href="#' + tabela + (ehNovo ? '' : '/' + esc(id)) + '">Cancelar</a>' +
      '<button class="btn primario" type="submit">Salvar</button></div></form>');
    $('#f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var btn = $('button[type=submit]', ev.target); btn.disabled = true;
      chamar('salvar', { tabela: tabela, id: id || null, dados: lerForm(ev.target) })
        .then(function (r) { aviso('Salvo com sucesso.'); ir('#' + tabela + '/' + r.id); })
        .catch(function (e) { btn.disabled = false; falhou(e); });
    });
  }).catch(falhou);
}

function botoesDetalhe(tabela, id) {
  return '<div class="acoes" style="margin-top:0">' +
    (pode(tabela, 'editar') ? '<a class="btn" href="#' + tabela + '/' + esc(id) + '/editar">Editar</a>' : '') +
    (pode(tabela, 'excluir') ? '<button class="btn perigo" type="button" data-acao="excluir">Excluir</button>' : '') + '</div>';
}

function ligarExcluir(tabela, id, nome) {
  var b = $('[data-acao="excluir"]');
  if (!b) return;
  b.addEventListener('click', function () {
    if (!confirm('Excluir ' + nome + '? O registro fica no histórico, mas some das listas.')) return;
    chamar('excluir', { tabela: tabela, id: id }).then(function () { aviso('Excluído.'); ir('#' + tabela); }).catch(falhou);
  });
}

function dado(rot, valor) { return '<div><span>' + esc(rot) + '</span>' + (valor || '—') + '</div>'; }

// ----- Veículos -----
TELAS.veiculos = function (id, sub) {
  if (id === 'novo') return telaForm('veiculos', null, 'veículo');
  if (id && sub === 'editar') return telaForm('veiculos', id, 'veículo');
  if (id) return detalheVeiculo(id);
  telaLista({
    tabela: 'veiculos', titulo: 'Veículos', icone: '🚗',
    ordenar: function (a, b) { return a.placa.localeCompare(b.placa); },
    textoBusca: function (v) { return [v.placa, v.marca, v.modelo, v.cor, v.status].join(' '); },
    titulo1: function (v) { return esc(v.placa) + ' · ' + esc(v.marca) + ' ' + esc(v.modelo); },
    sub: function (v) { return selo(v.status) + ' ' + esc(v.ano_modelo || '') + ' · ' + fmtKm(v.km_atual); }
  });
};

function detalheVeiculo(id) {
  chamar('buscar', { tabela: 'veiculos', id: id }).then(function (v) {
    if (!v || v.ativo !== 'TRUE') { render('<p class="vazio">Veículo não encontrado.</p>'); return; }
    render('<div class="barra"><h2>' + esc(v.placa) + ' · ' + esc(v.marca) + ' ' + esc(v.modelo) + '</h2>' + botoesDetalhe('veiculos', id) + '</div>' +
      '<div class="cartao detalhe-topo"><div class="foto-principal"' + (v.foto_id ? ' data-foto="' + esc(v.foto_id) + '"' : '') + '>🚗</div>' +
      '<div class="dados">' +
      dado('Status', selo(v.status)) + dado('Km atual', fmtKm(v.km_atual)) +
      dado('Ano', esc([v.ano_fabricacao, v.ano_modelo].filter(String).join('/'))) + dado('Versão', esc(v.versao)) +
      dado('Cor', esc(v.cor)) + dado('Combustível', esc(rotulo(v.combustivel))) + dado('RENAVAM', esc(v.renavam)) +
      dado('Chassi', esc(v.chassi)) + dado('Código FIPE', esc(v.codigo_fipe)) + dado('Aquisição', fmtData(v.data_aquisicao)) +
      dado('Valor de aquisição', fmtMoeda(v.valor_aquisicao)) + '</div>' +
      (v.observacoes ? '<p style="flex-basis:100%;margin:0">' + esc(v.observacoes) + '</p>' : '') + '</div>' +
      '<div class="secao cartao"><div class="barra"><h3>Histórico de km</h3>' +
      (pode('leituras_km', 'criar') ? '<button class="btn pequeno" type="button" data-acao="km">+ Registrar km</button>' : '') +
      '</div><div id="hist-km" class="tabela-rolagem"><p class="vazio">Carregando…</p></div></div>' +
      galeriaHtml('veiculos', id));
    preencherFotos($('#conteudo'));
    var recarregar = function () { detalheVeiculo(id); };
    ligarExcluir('veiculos', id, 'o veículo ' + v.placa);
    var bKm = $('[data-acao="km"]'); if (bKm) bKm.addEventListener('click', function () { registrarKmModal(v, recarregar); });
    var bArq = $('[data-acao="enviar-arquivo"]');
    if (bArq) bArq.addEventListener('click', function () {
      enviarArquivoModal('veiculos', v, ['foto_veiculo', 'documento_veiculo', 'outro'], recarregar);
    });
    carregarGaleria('veiculos', v, recarregar);
    chamar('listar', { tabela: 'leituras_km', filtro: { veiculo_id: id } }, true).then(function (ls) {
      ls.sort(function (a, b) { return (b.data + b.criado_em).localeCompare(a.data + a.criado_em); });
      $('#hist-km').innerHTML = ls.length ? '<table><tr><th>Data</th><th>Km</th><th>Origem</th><th>Obs.</th><th>Por</th></tr>' +
        ls.map(function (l) {
          return '<tr><td>' + fmtData(l.data) + '</td><td>' + fmtKm(l.km) + '</td><td>' + esc(rotulo(l.origem)) +
            '</td><td>' + esc(l.observacao) + '</td><td>' + esc(l.criado_por) + '</td></tr>';
        }).join('') + '</table>' : '<p class="vazio">Nenhuma leitura.</p>';
    }).catch(falhou);
  }).catch(falhou);
}

function registrarKmModal(v, aoAtualizar) {
  var origens = (estado.listas.origem_km || []).filter(function (o) {
    return o !== 'cadastro' && (o !== 'ajuste' || estado.usuario.perfil === 'administrador');
  });
  abrirModal('<h3>Registrar km · ' + esc(v.placa) + '</h3><p style="color:var(--texto-2)">Km atual: ' + fmtKm(v.km_atual) + '</p>' +
    '<form id="f-km" class="form"><label>Data<input type="date" name="data" value="' + hojeISO() + '" required></label>' +
    '<label>Km<input name="km" inputmode="numeric" required></label>' +
    '<label class="largo">Origem<select name="origem">' + origens.map(function (o) {
      return '<option value="' + o + '">' + esc(rotulo(o)) + '</option>'; }).join('') + '</select></label>' +
    '<label class="largo">Observação<input name="observacao"></label></form>' +
    '<div class="acoes"><button class="btn" data-a="cancelar">Cancelar</button><button class="btn primario" data-a="salvar">Salvar</button></div>');
  $('#modal-corpo').addEventListener('click', function (ev) {
    var a = ev.target.getAttribute('data-a');
    if (a === 'cancelar') fecharModal();
    if (a !== 'salvar') return;
    var d = lerForm($('#f-km')); d.veiculo_id = v.id;
    chamar('registrarKm', d).then(function () { fecharModal(); aviso('Km registrado.'); aoAtualizar(); }).catch(falhou);
  });
}

// ----- Motoristas -----
TELAS.motoristas = function (id, sub) {
  if (id === 'novo') return telaForm('motoristas', null, 'motorista');
  if (id && sub === 'editar') return telaForm('motoristas', id, 'motorista');
  if (id) return detalheMotorista(id);
  telaLista({
    tabela: 'motoristas', titulo: 'Motoristas', icone: '👤',
    ordenar: function (a, b) { return a.nome.localeCompare(b.nome); },
    textoBusca: function (m) { return [m.nome, m.cpf, m.telefone, m.email, m.status].join(' '); },
    titulo1: function (m) { return esc(m.nome); },
    sub: function (m) { return selo(m.status) + ' ' + situacaoCnh(m.cnh_validade) + ' · ' + esc(fmtTel(m.telefone)); }
  });
};

function detalheMotorista(id) {
  chamar('buscar', { tabela: 'motoristas', id: id }).then(function (m) {
    if (!m || m.ativo !== 'TRUE') { render('<p class="vazio">Motorista não encontrado.</p>'); return; }
    var tel = String(m.telefone || '');
    render('<div class="barra"><h2>' + esc(m.nome) + '</h2>' + botoesDetalhe('motoristas', id) + '</div>' +
      '<div class="cartao detalhe-topo"><div class="foto-principal"' + (m.foto_id ? ' data-foto="' + esc(m.foto_id) + '"' : '') + '>👤</div>' +
      '<div class="dados">' +
      dado('Status', selo(m.status)) + dado('CNH', situacaoCnh(m.cnh_validade)) +
      dado('CPF', esc(fmtCpf(m.cpf))) + dado('RG', esc(m.rg)) + dado('Nascimento', fmtData(m.data_nascimento)) +
      dado('Telefone', tel ? '<a href="https://wa.me/55' + esc(tel) + '" target="_blank" rel="noopener">' + esc(fmtTel(tel)) + '</a>' : '') +
      dado('E-mail', esc(m.email)) + dado('Endereço', esc([m.endereco, m.cidade, m.uf].filter(String).join(', '))) +
      dado('CEP', esc(m.cep)) + dado('Nº CNH', esc(m.cnh_numero)) + dado('Categoria', esc(m.cnh_categoria)) +
      dado('Validade CNH', fmtData(m.cnh_validade)) + dado('Plataforma', esc(rotulo(m.plataforma))) + '</div>' +
      (m.observacoes ? '<p style="flex-basis:100%;margin:0">' + esc(m.observacoes) + '</p>' : '') + '</div>' +
      galeriaHtml('motoristas', id));
    preencherFotos($('#conteudo'));
    var recarregar = function () { detalheMotorista(id); };
    ligarExcluir('motoristas', id, m.nome);
    var bArq = $('[data-acao="enviar-arquivo"]');
    if (bArq) bArq.addEventListener('click', function () {
      enviarArquivoModal('motoristas', m, ['cnh', 'comprovante_residencia', 'foto_motorista', 'outro'], recarregar);
    });
    carregarGaleria('motoristas', m, recarregar);
  }).catch(falhou);
}

// ----- Usuários (administrador) -----
TELAS.usuarios = function () {
  if (!pode('usuarios', 'ler')) { render('<p class="vazio">Sem permissão.</p>'); return; }
  render('<div class="barra"><h2>Usuários</h2><button class="btn primario" data-acao="novo-usuario">+ Novo</button></div>' +
    '<div class="cartao tabela-rolagem" id="lista-usuarios"><p class="vazio">Carregando…</p></div>');
  $('[data-acao="novo-usuario"]').addEventListener('click', function () { usuarioModal(null); });
  chamar('listarUsuarios').then(function (us) {
    $('#lista-usuarios').innerHTML = '<table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Último acesso</th><th></th></tr>' +
      us.map(function (u) {
        return '<tr><td>' + esc(u.nome) + '</td><td>' + esc(u.email) + '</td><td>' + esc(rotulo(u.perfil)) + '</td><td>' +
          esc(fmtData(u.ultimo_acesso) + ' ' + String(u.ultimo_acesso || '').slice(11, 16)) +
          '</td><td><button class="btn pequeno" data-editar="' + esc(u.id) + '">Editar</button></td></tr>';
      }).join('') + '</table>';
    $$('[data-editar]').forEach(function (b) {
      b.addEventListener('click', function () {
        usuarioModal(us.filter(function (u) { return u.id === b.getAttribute('data-editar'); })[0]);
      });
    });
  }).catch(falhou);
};

function usuarioModal(u) {
  var novo = !u; u = u || {};
  abrirModal('<h3>' + (novo ? 'Novo usuário' : 'Editar usuário') + '</h3><form id="f-u" class="form">' +
    '<label class="largo">Nome *<input name="nome" required value="' + esc(u.nome) + '"></label>' +
    '<label class="largo">E-mail (login) *<input name="email" type="email" required value="' + esc(u.email) + '"></label>' +
    '<label>Perfil<select name="perfil">' + ['operador', 'administrador'].map(function (p) {
      return '<option value="' + p + '"' + (u.perfil === p ? ' selected' : '') + '>' + rotulo(p) + '</option>'; }).join('') + '</select></label>' +
    '<label>' + (novo ? 'Senha *' : 'Nova senha (opcional)') + '<input name="senha" type="password" autocomplete="new-password"></label>' +
    '</form><p style="color:var(--texto-2);font-size:13px">Senha: mínimo 8 caracteres, com letras e números. Operador cadastra e edita, mas não exclui nem gerencia usuários.</p>' +
    '<div class="acoes">' + (!novo && u.id !== estado.usuario.id ? '<button class="btn perigo" data-a="excluir">Excluir</button>' : '') +
    '<button class="btn" data-a="cancelar">Cancelar</button><button class="btn primario" data-a="salvar">Salvar</button></div>');
  $('#modal-corpo').addEventListener('click', function (ev) {
    var a = ev.target.getAttribute('data-a');
    if (a === 'cancelar') fecharModal();
    if (a === 'excluir' && confirm('Excluir o usuário ' + u.nome + '?')) {
      chamar('excluirUsuario', { id: u.id }).then(function () { fecharModal(); aviso('Usuário excluído.'); TELAS.usuarios(); }).catch(falhou);
    }
    if (a !== 'salvar') return;
    var d = lerForm($('#f-u')), senha = d.senha; delete d.senha;
    chamar('salvarUsuario', { id: u.id || null, dados: d, senha: senha || null })
      .then(function () { fecharModal(); aviso('Usuário salvo.'); TELAS.usuarios(); }).catch(falhou);
  });
}

// ----- Perfil -----
TELAS.perfil = function () {
  var temas = [['claro', 'Claro'], ['escuro', 'Escuro'], ['frota', 'Verde frota']];
  render('<h2>Meu perfil</h2><div class="cartao"><h3>Tema de cores</h3><div class="temas">' +
    temas.map(function (t) {
      return '<button class="tema-opcao' + (document.body.getAttribute('data-tema') === t[0] ? ' ativo' : '') +
        '" data-tema="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div></div>' +
    '<form id="f-senha" class="cartao secao"><h3>Trocar senha</h3><div class="form">' +
    '<label>Senha atual<input type="password" name="senhaAtual" required autocomplete="current-password"></label>' +
    '<label>Nova senha<input type="password" name="novaSenha" required autocomplete="new-password"></label>' +
    '</div><div class="acoes"><button class="btn primario" type="submit">Trocar senha</button></div></form>');
  $$('.tema-opcao').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-tema');
      aplicarTema(t);
      $$('.tema-opcao').forEach(function (x) { x.classList.toggle('ativo', x === b); });
      estado.usuario.tema = t;
      chamar('salvarTema', { tema: t }, true).catch(falhou);
    });
  });
  $('#f-senha').addEventListener('submit', function (ev) {
    ev.preventDefault();
    chamar('trocarSenha', lerForm(ev.target)).then(function () { ev.target.reset(); aviso('Senha alterada.'); }).catch(falhou);
  });
};

// ---------- Início ----------
(function iniciar() {
  aplicarTema(lerArmazenado('tema') || 'claro');
  estado.token = lerArmazenado('token');
  if (!estado.token) return mostrarLogin();
  iniciarSessao().catch(function () { sairLocal(); });
})();
</script>
