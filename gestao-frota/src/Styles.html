<style>
  /* ===== Temas: cada tema só redefine as cores ===== */
  body[data-tema="claro"] {
    --fundo: #f4f6f9; --superficie: #ffffff; --texto: #1d2430; --texto-2: #5b6576;
    --borda: #dde2ea; --primaria: #1f6feb; --primaria-texto: #ffffff;
    --ok: #1a7f37; --alerta: #b7791f; --perigo: #c53030; --sombra: 0 1px 3px rgba(0,0,0,.08);
  }
  body[data-tema="escuro"] {
    --fundo: #0f1419; --superficie: #1a2028; --texto: #e6e9ee; --texto-2: #9aa4b2;
    --borda: #2c3440; --primaria: #4c9aff; --primaria-texto: #0f1419;
    --ok: #3fb950; --alerta: #d29922; --perigo: #f85149; --sombra: 0 1px 3px rgba(0,0,0,.4);
  }
  body[data-tema="frota"] {
    --fundo: #eef5f3; --superficie: #ffffff; --texto: #12312b; --texto-2: #4d6b64;
    --borda: #cfe0db; --primaria: #0b7a65; --primaria-texto: #ffffff;
    --ok: #1a7f37; --alerta: #c27c0e; --perigo: #b42318; --sombra: 0 1px 3px rgba(11,122,101,.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo); color: var(--texto); font-size: 15px; line-height: 1.45;
  }
  .oculto { display: none !important; }
  h1, h2, h3 { margin: 0 0 12px; line-height: 1.2; }
  h1 { font-size: 22px; } h2 { font-size: 19px; } h3 { font-size: 16px; }
  a { color: var(--primaria); }

  /* ===== Estrutura ===== */
  .topo {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--superficie); border-bottom: 1px solid var(--borda);
  }
  .marca { flex: 1; color: var(--primaria); }
  .usuario { color: var(--texto-2); font-size: 13px; }
  .menu {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: flex;
    background: var(--superficie); border-top: 1px solid var(--borda);
  }
  .menu a {
    flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 2px 8px;
    font-size: 11px; color: var(--texto-2); text-decoration: none;
  }
  .menu a .ico { font-size: 18px; }
  .menu a.ativo { color: var(--primaria); font-weight: 600; }
  .conteudo { padding: 16px; padding-bottom: 84px; max-width: 1100px; margin: 0 auto; }

  @media (min-width: 900px) {
    #app { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr; }
    .topo { grid-column: 1 / 3; }
    .menu {
      position: sticky; top: 49px; flex-direction: column; height: calc(100vh - 49px);
      border-top: 0; border-right: 1px solid var(--borda); padding-top: 8px;
    }
    .menu a { flex: none; flex-direction: row; gap: 10px; padding: 10px 16px; font-size: 14px; }
    .conteudo { padding: 24px; width: 100%; }
  }

  /* ===== Componentes ===== */
  .cartao {
    background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px;
    padding: 16px; box-shadow: var(--sombra);
  }
  .grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .indicadores { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 16px; }
  .indicador .valor { font-size: 26px; font-weight: 700; }
  .indicador .rotulo { color: var(--texto-2); font-size: 13px; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .barra h2 { flex: 1; margin: 0; }
  .barra input[type=search] { flex: 1 1 220px; }

  .btn {
    border: 1px solid var(--borda); background: var(--superficie); color: var(--texto);
    padding: 9px 14px; border-radius: 8px; font: inherit; cursor: pointer; text-decoration: none;
    display: inline-block; text-align: center;
  }
  .btn.primario { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); font-weight: 600; }
  .btn.perigo { color: var(--perigo); border-color: var(--perigo); }
  .btn.fantasma { background: transparent; }
  .btn.pequeno { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .6; cursor: default; }

  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--texto-2); }
  input, select, textarea {
    font: inherit; color: var(--texto); background: var(--superficie);
    border: 1px solid var(--borda); border-radius: 8px; padding: 9px 10px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primaria); outline-offset: -1px; }
  .form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .form .largo { grid-column: 1 / -1; }
  .acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

  .item { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .item:hover { border-color: var(--primaria); }
  .item .miniatura {
    width: 56px; height: 56px; border-radius: 8px; background: var(--fundo); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden;
  }
  .item .miniatura img { width: 100%; height: 100%; object-fit: cover; }
  .item .info { min-width: 0; flex: 1; }
  .item .titulo { font-weight: 600; }
  .item .sub { color: var(--texto-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .selo { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .selo.ok { color: var(--ok); } .selo.alerta { color: var(--alerta); } .selo.perigo { color: var(--perigo); } .selo.neutro { color: var(--texto-2); }

  .detalhe-topo { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 16px; }
  .foto-principal { width: 220px; max-width: 100%; aspect-ratio: 4/3; border-radius: 10px; background: var(--fundo);
    display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 48px; }
  .foto-principal img { width: 100%; height: 100%; object-fit: cover; }
  .dados { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; flex: 1; }
  .dados > div > span:first-child { display: block; color: var(--texto-2); font-size: 12px; }
  .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .galeria figure { margin: 0; font-size: 12px; color: var(--texto-2); }
  .galeria .thumb { aspect-ratio: 1; border-radius: 8px; background: var(--fundo); overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .galeria .thumb img { width: 100%; height: 100%; object-fit: cover; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--borda); }
  th { color: var(--texto-2); font-weight: 600; font-size: 12px; }
  .tabela-rolagem { overflow-x: auto; }
  .secao { margin-top: 16px; }
  .vazio { color: var(--texto-2); text-align: center; padding: 24px; grid-column: 1 / -1; }

  .temas { display: flex; gap: 10px; flex-wrap: wrap; }
  .tema-opcao { border: 2px solid var(--borda); border-radius: 10px; padding: 10px 14px; cursor: pointer; background: var(--superficie); color: var(--texto); font: inherit; }
  .tema-opcao.ativo { border-color: var(--primaria); }

  /* ===== Login, avisos, carregamento, modal ===== */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-cartao { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .login-cartao h1 { color: var(--primaria); text-align: center; }
  .erro { color: var(--perigo); min-height: 1em; margin: 0; font-size: 14px; }
  .carregando { position: fixed; inset: 0; background: rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--borda); border-top-color: var(--primaria); border-radius: 50%; animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .aviso { position: fixed; left: 16px; right: 16px; bottom: 76px; z-index: 60; max-width: 480px; margin: 0 auto;
    padding: 12px 16px; border-radius: 10px; color: #fff; background: #2d3748; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .aviso.erro-aviso { background: var(--perigo); }
  .modal { border: 0; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    background: var(--superficie); color: var(--texto); }
  .modal::backdrop { background: rgba(0,0,0,.4); }
  #modal-corpo { padding: 18px; }
  .modal img.ampliada { width: 100%; border-radius: 8px; }
</style>
